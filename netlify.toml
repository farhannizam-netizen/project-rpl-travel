[build]
  command = "npm ci && npm run build"
  publish = "frontend/dist"

[[redirects]]
  from = "/api/*"
  to = "https://project-rpl-travel.onrender.com/api/:splat"
  status = 200

[[redirects]]
  from = "/static/*"
  to = "https://project-rpl-travel.onrender.com/static/:splat"
  status = 200

[[redirects]]
  from = "/favicon.png"
  to = "https://project-rpl-travel.onrender.com/favicon.png"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
