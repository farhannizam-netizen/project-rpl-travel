[build]
  command = "npm ci && npm run build"
  publish = "frontend/dist"

  [[headers]]
    for = "/"
    [headers.values]
      Cache-Control = "public, max-age=0, must-revalidate"

  [[headers]]
    for = "/index.html"
    [headers.values]
      Cache-Control = "public, max-age=0, must-revalidate"

  [[headers]]
    for = "/assets/*"
    [headers.values]
      Cache-Control = "public, max-age=31536000, immutable"

  [[headers]]
    for = "/static/css/*"
    [headers.values]
      Cache-Control = "public, max-age=0, must-revalidate"

  [[headers]]
    for = "/api/*"
    [headers.values]
      Cache-Control = "no-store"

  [[redirects]]
    from = "/api/*"
  to = "https://project-rpl-travel.onrender.com/api/:splat"
  status = 200

[[redirects]]
  from = "/static/*"
  to = "https://project-rpl-travel.onrender.com/static/:splat"
  status = 200

[[redirects]]
  from = "/favicon.png"
  to = "https://project-rpl-travel.onrender.com/favicon.png"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
