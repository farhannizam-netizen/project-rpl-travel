
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri - Kurma Travel</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/site-nav.css">
    <link rel="stylesheet" href="static/css/site-theme.css">
    <script src="static/js/site-nav.js" defer></script>
    <script src="static/js/site-components.js" defer></script>
    <script src="static/js/gallery.js" defer></script>

    <style>

        /* LIGHTBOX */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, .88);
        }

        .lightbox img {
            display: block;
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 10px;
        }

        .lightbox-close {
            position: absolute;
            top: 15px;
            right: 22px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 38px;
            cursor: pointer;
        }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            width: 48px;
            height: 48px;
            border: 1px solid rgba(255,255,255,.55);
            border-radius: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,.48);
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }
        .lightbox-prev { left: 24px; }
        .lightbox-next { right: 24px; }
    </style>
</head>

<body>

    <div id="siteNavigation"></div>

    <!-- MODAL PILIH ADMIN WHATSAPP -->
    <div id="waModal" class="wa-modal" aria-hidden="true">

        <div class="wa-box">
            <h3>Pilih Admin WhatsApp</h3>

            <a id="wa1" href="https://wa.me/6281280803429" target="_blank" rel="noopener noreferrer">
                Chat Admin 1 · 0812-8080-3429
            </a>

            <a id="wa2" href="https://wa.me/6283875613645" target="_blank" rel="noopener noreferrer">
                Chat Admin 2 · 0838-7561-3645
            </a>

            <a id="wa3" href="https://wa.me/6287776042572" target="_blank" rel="noopener noreferrer">
                Chat Admin 3 · 0877-7604-2572
            </a>

            <button type="button" onclick="closeWA()">Tutup</button>
        </div>
    </div>

    <!-- HEADER -->
    <section class="hero kt-page-hero">

        <div class="overlay"></div>

        <div class="container hero-content">
            <span class="kt-page-hero__badge">Dokumentasi Perjalanan</span>
            <h1>Galeri Kurma Travel</h1>
            <p>Dokumentasi perjalanan dan aktivitas jamaah bersama Kurma Travel.</p>
        </div>
    </section>

    <!-- GALERI -->
    <section class="section">
        <div class="container">
            <div class="gallery-grid" id="gallery"></div>
        </div>
    </section>

    <!-- LIGHTBOX FOTO -->
    <div id="lightbox" class="lightbox" aria-hidden="true">

        <button type="button" class="lightbox-close"
                aria-label="Tutup foto">
            &times;
        </button>
        <button type="button" class="lightbox-nav lightbox-prev"
                aria-label="Foto sebelumnya">&#10094;</button>

        <img id="lightbox-img" src="" alt="Foto dokumentasi Kurma Travel">
        <button type="button" class="lightbox-nav lightbox-next"
                aria-label="Foto berikutnya">&#10095;</button>
    </div>

    <!-- FOOTER -->
    <div id="siteFooter"></div>

</body>
</html>
